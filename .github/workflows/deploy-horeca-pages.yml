name: Deploy horeca landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "horeca/**"
      - ".github/workflows/deploy-horeca-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload horeca/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: horeca

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
